<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#34383c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Study Atlas">
  <link rel="manifest" href="/study-reader/app.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/study-reader/icons/apple-touch-icon.png">
  <title>Study Atlas</title>
  <style>
    :root { color-scheme: dark; font-family: Aptos, Segoe UI, Arial, sans-serif; color: #f5f2ea; background: #0b1010; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background-image: linear-gradient(#a1b0a10a 1px, transparent 1px), linear-gradient(90deg, #a1b0a10a 1px, transparent 1px); background-size: 32px 32px; }
    main { width: min(100%, 460px); padding: clamp(26px, 6vw, 44px); border: 1px solid #53635a; border-radius: 4px; background: #15201d; box-shadow: 0 22px 80px #0009; }
    .mark { display: inline-grid; place-items: center; width: 50px; height: 50px; border: 1px solid #a9926d; border-radius: 4px; background: #1b2824; color: #e2c590; }
    .mark svg { width: 34px; height: 34px; }
    .overline { margin: 22px 0 8px; color: #e2c590; font: 700 12px Consolas, monospace; letter-spacing: .12em; }
    h1 { margin: 0 0 10px; font: 700 clamp(30px, 6vw, 39px)/1.13 Georgia, serif; }
    p { font-size: 18px; line-height: 1.65; color: #c6d0c8; }
    label { display: block; margin: 26px 0 8px; font-weight: 700; font-size: 17px; }
    input { width: 100%; padding: 14px 15px; border: 1px solid #7d8c80; border-radius: 4px; background: #0b1010; color: #f5f2ea; font: inherit; font-size: 19px; }
    input:focus { outline: 3px solid #f3a667; outline-offset: 2px; }
    button { width: 100%; margin-top: 14px; padding: 14px 16px; border: 0; border-radius: 4px; background: #e2c590; color: #0b1010; font: inherit; font-size: 18px; font-weight: 750; cursor: pointer; }
    button:hover, button:focus-visible { background: #f6dda9; }
    button:disabled { cursor: wait; opacity: .7; }
    #status { min-height: 24px; margin: 14px 0 0; font-size: 16px; }
    .install-tip { margin: 24px 0 0; border-top: 1px solid #53635a; padding-top: 17px; font-size: 15px; line-height: 1.5; }
    .install-tip strong { color: #d0eaf9; }
    /* Frosted controls, with an opaque fallback for reduced transparency. */
    :root { color: #f5f8fa; background: #09111a; }
    body { background: radial-gradient(ellipse at 80% 10%, #629cc36b, transparent 45%), radial-gradient(ellipse at 10% 90%, #75629c4a, transparent 48%), #09111a; }
    main { border: 1px solid #d6f0fc6b; border-radius: 28px; background: linear-gradient(140deg, #294150d9, #14232fea 72%); box-shadow: 0 1px 0 #ffffff66 inset, 0 28px 90px #0009; -webkit-backdrop-filter: blur(28px) saturate(145%); backdrop-filter: blur(28px) saturate(145%); }
    .mark { border: 1px solid #dcf4ff87; border-radius: 15px; background: #c2e8fb1c; color: #d8f0fc; box-shadow: 0 1px 0 #ffffff55 inset; }
    .overline { color: #d2ecfa; }
    h1 { color: #f5f8fa; }
    p { color: #d9e6ed; }
    input { border: 1px solid #c4e1f488; border-radius: 14px; background: #0d1b29d9; color: #f5f8fa; }
    button { border-radius: 15px; background: #d1eafa; color: #0c1a28; box-shadow: 0 1px 0 #ffffffbb inset; }
    button:hover, button:focus-visible { background: #f0f9ff; }
    .install-tip { border-top-color: #c4e1f466; }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { main { background: #1b2c39; -webkit-backdrop-filter: none; backdrop-filter: none; border-color: #d6f0fc; } }
    :root { background: #34383c; }
    body { background: radial-gradient(ellipse at 80% 8%, #c4ccd095, transparent 48%), radial-gradient(ellipse at 0% 96%, #8f8c9b6b, transparent 48%), #34383c; }
    main { background: linear-gradient(140deg, #737b7cdd, #50585bee 72%); border-color: #f4f6efa8; }
    .mark { background: #f1f2ed30; border-color: #f8f8f3ad; color: #f8f8f3; }
    .overline { color: #f2f3ec; }
    input { background: #444b4ee0; border-color: #f1f3ed9b; }
    button { background: #e9ece7; color: #303538; }
    button:hover, button:focus-visible { background: #fcfdf8; }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) { main { background: #585f62; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 42 42" fill="none"><path d="M9 34V20a12 12 0 0 1 24 0v14M4 34h34M9 23h24M21 8v26" stroke="currentColor" stroke-width="2"/></svg></div>
    <p class="overline">STUDY ATLAS / PRIVATE DESK</p>
    <h1>Open your lessons.</h1>
    <p>Enter your access code once. Subject pages will stay open during this app session.</p>
    <form id="unlock-form">
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button id="unlock-button" type="submit">Open lessons</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p id="install-tip" class="install-tip" hidden><strong>Make this your iPhone app:</strong> In Safari, tap Share, choose Add to Home Screen, then turn on Open as Web App if shown.</p>
  </main>
  <script>
    const form = document.getElementById('unlock-form');
    const field = document.getElementById('code');
    const button = document.getElementById('unlock-button');
    const status = document.getElementById('status');
    const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
    const sessionKey = 'study-reader-session-code-v1';

    if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches) {
      document.getElementById('install-tip').hidden = false;
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/study-reader/service-worker.js', { scope: '/study-reader/' }).catch(() => {});
    }

    async function openLessons(accessCode, automatic = false) {
      button.disabled = true;
      status.textContent = automatic ? 'Opening your saved session…' : 'Opening lessons…';
      try {
        const response = await fetch('./payload.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('download');
        const sealed = await response.json();
        const passwordKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(accessCode), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: decode(sealed.salt), iterations: sealed.iterations }, passwordKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(sealed.iv) }, key, decode(sealed.ciphertext));
        const lesson = JSON.parse(new TextDecoder().decode(plaintext));
        const assets = {
          'styles.css': URL.createObjectURL(new Blob([lesson.css], { type: 'text/css' })),
          'app.js': URL.createObjectURL(new Blob([lesson.js], { type: 'text/javascript' }))
        };
        let page = lesson.html;
        for (const [original, replacement] of Object.entries(assets)) {
          if (!page.includes(original)) throw new Error('asset');
          page = page.replaceAll(original, replacement);
        }
        if (page.includes('structural-studies-guide.pdf')) {
          if (!lesson.pdf) throw new Error('asset');
          page = page.replaceAll('structural-studies-guide.pdf', URL.createObjectURL(new Blob([decode(lesson.pdf)], { type: 'application/pdf' })));
        }
        try { sessionStorage.setItem(sessionKey, accessCode); } catch (_) { /* Storage can be unavailable in private browsing. */ }
        document.open();
        document.write(page);
        document.close();
        if (location.pathname !== '/study-reader/' && location.pathname !== '/study-reader/index.html') {
          let backgroundedAt = 0;
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) backgroundedAt = Date.now();
            else if (backgroundedAt && Date.now() - backgroundedAt > 180000 && navigator.onLine) location.assign('/study-reader/');
          });
        }
      } catch (error) {
        if (automatic && error.message !== 'download') {
          try { sessionStorage.removeItem(sessionKey); } catch (_) {}
        }
        status.textContent = error.message === 'download' ? 'Could not load the lessons. Check your connection and try again.' : automatic ? 'Please enter your access code to start a new session.' : 'That access code did not open the lessons. Check it and try again.';
        button.disabled = false;
        if (!automatic) field.select();
      }
    }
    form.addEventListener('submit', event => {
      event.preventDefault();
      openLessons(field.value.trim());
    });
    try {
      const saved = sessionStorage.getItem(sessionKey);
      if (saved) openLessons(saved, true);
    } catch (_) {}
  </script>
</body>
</html>
