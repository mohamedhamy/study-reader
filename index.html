<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#152d42">
  <title>Private Lesson Reader</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #172e43; background: #f6f9fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: clamp(26px, 6vw, 42px); border: 1px solid #d4e1e9; border-radius: 18px; background: white; box-shadow: 0 22px 60px #17334a14; }
    .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: #17334a; color: #54d4ca; font-size: 26px; }
    h1 { margin: 24px 0 10px; font-size: clamp(26px, 6vw, 32px); line-height: 1.15; }
    p { font-size: 16px; line-height: 1.55; color: #4b6273; }
    label { display: block; margin: 26px 0 8px; font-weight: 700; font-size: 15px; }
    input { width: 100%; padding: 14px 15px; border: 1px solid #9cb4c4; border-radius: 9px; font: inherit; font-size: 17px; }
    input:focus { outline: 3px solid #8bd9d3; outline-offset: 2px; }
    button { width: 100%; margin-top: 14px; padding: 14px 16px; border: 0; border-radius: 9px; background: #086e70; color: white; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .7; }
    #status { min-height: 24px; margin: 14px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">▥</div>
    <h1>Private lesson reader</h1>
    <p>Enter your access code to open your lessons and practice questions.</p>
    <form id="unlock-form">
      <label for="code">Access code</label>
      <input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button id="unlock-button" type="submit">Open lessons</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('unlock-form');
    const field = document.getElementById('code');
    const button = document.getElementById('unlock-button');
    const status = document.getElementById('status');
    const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Opening lessons…';
      try {
        const response = await fetch('./payload.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('download');
        const sealed = await response.json();
        const passwordKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value.trim()), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: decode(sealed.salt), iterations: sealed.iterations }, passwordKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: decode(sealed.iv) }, key, decode(sealed.ciphertext));
        const lesson = JSON.parse(new TextDecoder().decode(plaintext));
        const assets = {
          'styles.css': URL.createObjectURL(new Blob([lesson.css], { type: 'text/css' })),
          'app.js': URL.createObjectURL(new Blob([lesson.js], { type: 'text/javascript' })),
          'structural-studies-guide.pdf': URL.createObjectURL(new Blob([decode(lesson.pdf)], { type: 'application/pdf' }))
        };
        let page = lesson.html;
        for (const [original, replacement] of Object.entries(assets)) {
          if (!page.includes(original)) throw new Error('asset');
          page = page.replaceAll(original, replacement);
        }
        document.open();
        document.write(page);
        document.close();
      } catch (error) {
        status.textContent = error.message === 'download' ? 'Could not load the lessons. Check your connection and try again.' : 'That access code did not open the lessons. Check it and try again.';
        button.disabled = false;
        field.select();
      }
    });
  </script>
</body>
</html>
